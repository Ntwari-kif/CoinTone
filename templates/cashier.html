<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cashier – PayVerify</title><meta name="theme-color" content="#0a1a3f"><script src="/static/theme.js"></script><link rel="stylesheet" href="/static/style.css?v=2"></head><body>
<div id="bar"></div>
<div class="wrap narrow">
  <div id="lock" class="banner bad" hidden></div>
  <div id="main">
  <div class="card" style="padding:10px"><label style="margin:0 0 4px">Branch</label><select class="in" id="branch"></select></div>
  <div class="total"><small>Verified today · this branch</small><span class="num" id="ctotal">0</span><div class="s" id="cby"></div></div>
  <div class="card"><h2>Verify a payment</h2>
    <label for="exp">Amount customer should pay (optional)</label><input class="in" id="exp" inputmode="decimal" placeholder="e.g. 1500">
    <label for="sms">Payment SMS</label><textarea class="in" id="sms" placeholder="Copy the payment SMS and paste it here"></textarea>
    <div class="g2" style="margin-top:8px"><button class="btn p" id="paste">📋 Paste &amp; verify</button><button class="btn n" id="go">Verify text</button></div>
    <label class="chk"><input type="checkbox" id="say"> Speak the amount out loud when verified</label></div>
  <div class="card"><h2>Other ways to record a payment</h2><div class="g3">
    <button class="btn" data-o="cash">💵 Cash</button><button class="btn" data-o="card">💳 Card</button><button class="btn" data-o="bank">🏦 Bank</button></div>
    <button class="btn block" data-o="mobile" style="margin-top:8px">Record mobile money manually</button>
    <p class="hint" style="margin-top:6px">Manual mobile money entries are sent to the owner for approval.</p></div>
  <input class="in" id="srch" placeholder="Search name, code, amount…" style="margin-bottom:6px">
  <div class="chips" id="flt"><button class="chip on" data-f="all">All</button><button class="chip" data-f="verified">Verified</button><button class="chip" data-f="review">Awaiting review</button><button class="chip" data-f="failed">Failed</button></div>
  <div id="clog"></div>
  </div>
</div>
<div id="ov"></div><div id="sheet"><div id="sbody"></div></div><div id="toast"></div>
<script src="/static/common.js"></script><script>
$("#bar").innerHTML=topbar("Cashier");
let S=null,TX=[],filt="all";
const cur=()=>S.shop.currency;
function beep(k){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=k==="ok"?880:k==="chk"?520:200;g.gain.value=.14;o.start();o.stop(a.currentTime+(k==="ok"?.25:.6))}catch(e){}navigator.vibrate&&navigator.vibrate(k==="ok"?80:[200,100,200])}
function overlay(r){const o=$("#ov");o.className="show "+r.level;
  o.innerHTML=`<h1>${r.level==="ok"?"✔ ":r.level==="bad"?"✖ ":"⚠ "}${esc(r.title)}</h1><div class="num">${esc(r.amount)}</div><p>${esc(r.sub||"")}</p><p style="margin-top:22px;opacity:.7;font-size:14px">Tap to dismiss</p>`;
  beep(r.level);if(r.level==="ok"&&$("#say").checked&&window.speechSynthesis)speechSynthesis.speak(new SpeechSynthesisUtterance("Payment received "+r.amount))}
$("#ov").onclick=()=>$("#ov").className="";
const close=()=>$("#sheet").classList.remove("show");
function sheet(h){$("#sbody").innerHTML=h;$("#sheet").classList.add("show")}$("#sheet").onclick=e=>{if(e.target.id==="sheet")close()};
const chan=x=>x.method==="mobile"?(x.provider||"Mobile money"):({cash:"Cash",card:"Card / POS",bank:"Bank transfer"}[x.method]||x.method);
const lbl=s=>s==="review"?"awaiting review":s;
function row(x){return`<div class="row" data-id="${x.id}"><div class="m"><b>${esc(x.payer)}</b><small>${hm(x.created_at)} · ${esc(chan(x))}${x.code?" · "+esc(x.code):""}</small></div><div><span class="num">${fmt(x.amount,x.currency)}</span><span class="st ${x.status}">${lbl(x.status)}</span></div></div>`}
function render(){
  const lk=S.locked;$("#lock").hidden=!lk;$("#main").hidden=lk;
  if(lk){$("#lock").textContent="This shop's subscription is not active ("+S.sub_state+"). Please ask the owner to renew it.";return}
  const b=$("#branch");if(b.options.length!==S.shop.branches.length){b.innerHTML=S.shop.branches.map(x=>`<option>${esc(x)}</option>`).join("");b.value=localStorage.getItem("pv_br")||S.shop.branches[0];if(!b.value)b.selectedIndex=0}
  const td=TX.filter(x=>x.branch===b.value),ver=td.filter(x=>x.status==="verified"),by={};ver.forEach(x=>by[chan(x)]=(by[chan(x)]||0)+x.amount);
  $("#ctotal").textContent=fmt(ver.reduce((s,x)=>s+x.amount,0),cur());
  const rv=td.filter(x=>x.status==="review").length;
  $("#cby").innerHTML=Object.entries(by).map(([k,v])=>`<span>${esc(k)}: ${fmt(v)}</span>`).join("")+(rv?`<span style="color:#ffd35c">${rv} awaiting owner</span>`:"");
  const q=$("#srch").value.toLowerCase(),l=td.filter(x=>(filt==="all"||x.status===filt||(filt==="failed"&&x.status==="void"))&&(!q||(x.payer+x.code+x.amount+chan(x)).toLowerCase().includes(q)));
  $("#clog").innerHTML=l.map(row).join("")||'<p class="empty">Nothing here yet. Paste a payment SMS to get started.</p>'}
$("#clog").onclick=e=>{const r=e.target.closest(".row");if(!r)return;const x=TX.find(t=>t.id===r.dataset.id);if(!x)return;
  sheet(`<h2>${fmt(x.amount,x.currency)} <span class="st ${x.status}">${lbl(x.status)}</span></h2><p>${esc(x.payer)}${x.phone?" · "+esc(x.phone):""}</p><p class="hint">${esc(chan(x))} · ${dtm(x.created_at)} · ${esc(x.branch)} · ${esc(x.cashier_name)}</p>${x.code?`<p>Ref: <b>${esc(x.code)}</b></p>`:""}${x.note?`<p class="hint">${esc(x.note)}</p>`:""}<button class="btn block" id="rc" style="margin-top:10px">Share receipt</button>`);
  $("#rc").onclick=()=>{const t=`${S.shop.name} receipt\n${fmt(x.amount,x.currency)} via ${chan(x)}\n${x.payer}\nRef: ${x.code||"-"}\n${dtm(x.created_at)}`;navigator.share?navigator.share({text:t}).catch(()=>{}):navigator.clipboard?.writeText(t).then(()=>toast("Receipt copied"))}};
async function submit(url,body){try{const r=await api(url,body);overlay(r);await refresh();return true}catch(e){if(e.status===402)refresh();toast(e.message);return false}}
async function verify(t){t=(t||"").trim();if(!t)return toast("Paste the payment SMS first");
  if(await submit("/api/cashier/verify",{sms:t,expected:$("#exp").value,branch:$("#branch").value})){$("#sms").value="";$("#exp").value=""}}
$("#go").onclick=()=>verify($("#sms").value);
$("#paste").onclick=async()=>{try{const t=await navigator.clipboard.readText();if(!t)throw 0;$("#sms").value=t;verify(t)}catch(e){$("#sms").focus();toast("Long-press the box, tap Paste, then Verify")}};
$("#sms").addEventListener("paste",()=>setTimeout(()=>{if($("#sms").value.length>20)verify($("#sms").value)},50));
$$("[data-o]").forEach(b=>b.onclick=()=>{const m=b.dataset.o,L={cash:"Cash payment",card:"Card / POS payment",bank:"Bank transfer",mobile:"Mobile money (manual)"}[m];
  sheet(`<h2>${L}</h2><label>Amount (${esc(cur())})</label><input class="in" id="ma" inputmode="decimal"><label>Customer name (optional)</label><input class="in" id="mp">${m==="cash"?"":`<label>${m==="mobile"?"Transaction code (if you have it)":"Reference / approval code"}</label><input class="in" id="mr">`}<button class="btn p block" id="msv" style="margin-top:14px">Record payment</button>`);
  $("#msv").onclick=async()=>{if(await submit("/api/cashier/manual",{method:m,amount:$("#ma").value,payer:$("#mp").value,ref:($("#mr")||{}).value||"",branch:$("#branch").value}))close()}});
$("#branch").onchange=e=>{localStorage.setItem("pv_br",e.target.value);render()};
$("#srch").oninput=render;
$("#flt").onclick=e=>{const b=e.target.closest("[data-f]");if(!b)return;filt=b.dataset.f;$$("#flt .chip").forEach(c=>c.classList.toggle("on",c===b));render()};
async function refresh(){S=await api("/api/cashier/state");TX=S.tx||[];$("#who").textContent=S.user.name+" · "+S.shop.name;render()}
live(refresh,3000);
</script></body></html>
