<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Sign in – CTone</title>
  <meta name="theme-color" content="#0a1a3f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CTone">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
  <script src="{{ url_for('static', filename='pwa.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <button class="themebtn" data-theme-btn onclick="toggleTheme()" aria-label="Switch light or dark mode"></button>
  <div class="lead">
    <div class="card">
      <img class="hero-logo" src="{{ url_for('static', filename='icon-192.png') }}" alt="CTone logo">
      <h1 class="ctr">CTone</h1>
      <p class="hint ctr" style="margin-bottom:6px">Sign in as admin, shop owner or cashier.</p>
      <label for="em">Email</label>
      <input class="in" id="em" type="email" autocomplete="username">
      <label for="pw">Password</label>
      <input class="in" id="pw" type="password" autocomplete="current-password">
      <button class="btn n block" id="go" style="margin-top:16px">Sign in</button>
      <p class="msg" id="msg"></p>
      <button class="btn block" data-install-btn hidden onclick="installApp()" style="margin-top:12px">📲 Install app on this phone</button>
      <p class="hint" data-ios-hint hidden style="margin-top:12px">To install on iPhone: tap the Share button, then “Add to Home Screen”.</p>
      <p class="hint" style="margin-top:14px">New here? <a href="/register">Create an account</a></p>
    </div>
  </div>
  <script src="{{ url_for('static', filename='common.js') }}"></script>
  <script>
    async function go() {
      const b = $("#go");
      if (b.disabled) return;
      b.disabled = true;
      $("#msg").textContent = "";
      try {
        const r = await api("/api/login", {
          email: $("#em").value,
          password: $("#pw").value
        });
        location.href = r.redirect;
      } catch (e) {
        $("#msg").className = "msg bad";
        $("#msg").textContent = e.message;
        b.disabled = false;
      }
    }
    $("#go").onclick = go;
    $("#pw").onkeydown = e => e.key === "Enter" && go();
  </script>
</body>
</html>
