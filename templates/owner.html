<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Owner – CTone</title>
  <meta name="theme-color" content="#0a1a3f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CTone">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
  <script src="{{ url_for('static', filename='pwa.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div id="bar"></div>
  <div class="wrap">
    <div class="card" id="sub"></div>
    <div id="body" hidden>
      <div class="tools">
        <input type="date" class="in" id="day" style="width:auto">
        <a class="btn n" id="csv" style="text-decoration:none">Download CSV</a>
        <button class="btn" onclick="window.print()">Print</button>
        <span class="hint"><span class="live"></span>Live</span>
      </div>
      <div class="kpis" id="k"></div>
      <div class="grid">
        <div>
          <div class="card" id="tgt" hidden></div>
          <div class="card">
            <h2>Live transactions</h2>
            <div id="feed"></div>
          </div>
          <div class="card">
            <h2>Sales by hour</h2>
            <div class="hr" id="hours"></div>
            <div class="hl"><span>00h</span><span>06h</span><span>12h</span><span>18h</span><span>23h</span></div>
          </div>
          <div class="card">
            <h2>Last 7 days</h2>
            <div class="hr" id="wk"></div>
            <div class="hl" id="wkl"></div>
          </div>
        </div>
        <div>
          <div class="card">
            <h2>👥 Cashier access</h2>
            <p class="hint" style="margin-bottom:8px">Share your shop code <b id="code" style="letter-spacing:3px"></b> with cashiers. They can only enter after you approve them here.</p>
            <div id="cash"></div>
          </div>
          <div class="card">
            <h2>⚠ Fraud &amp; review alerts</h2>
            <div id="fraud"></div>
          </div>
          <div class="card">
            <h2>By branch</h2>
            <div id="bb"></div>
            <h2 style="margin-top:14px">By channel</h2>
            <div id="bm"></div>
          </div>
          <div class="card">
            <h2>Shop settings</h2>
            <label for="sName">Shop name</label>
            <input class="in" id="sName">
            <label for="sCur">Currency code</label>
            <input class="in" id="sCur" maxlength="4">
            <label for="sBr">Branches (comma separated)</label>
            <input class="in" id="sBr">
            <label for="sBig">Flag sales at or above</label>
            <input class="in" id="sBig" inputmode="decimal">
            <label for="sSt">Flag SMS older than (minutes)</label>
            <input class="in" id="sSt" inputmode="numeric">
            <label for="sTg">Daily sales target (optional)</label>
            <input class="in" id="sTg" inputmode="decimal">
            <label>Payment channels accepted</label>
            <div id="sCh"></div>
            <button class="btn n block" id="sSave" style="margin-top:10px">Save settings</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="sheet"><div id="sbody"></div></div>
  <div id="toast"></div>
  <script src="{{ url_for('static', filename='common.js') }}"></script>
  <script>
    $('#bar').innerHTML = topbar('Owner');
    let D = null, od = todayStr(), formInit = false, payInit = false;
    const chan = x => x.method === 'mobile' ? x.provider || 'Mobile money' : {
      cash: 'Cash',
      card: 'Card / POS',
      bank: 'Bank transfer'
    }[x.method] || x.method;
    const FL = {
      duplicate: 'Duplicate transaction code',
      manual: 'Manual entry – no SMS proof',
      mismatch: "Amount didn't match the sale",
      stale: "SMS time doesn't match now",
      large: 'Unusually large amount',
      currency: 'Different currency than the shop',
      nocode: 'SMS had no transaction code',
      noref: 'No payment reference',
      overpaid: 'Customer overpaid',
      void: 'Voided sale'
    };
    const lbl = s => s === 'review' ? 'awaiting review' : s;
    function row(x) {
      return `<div class="row" data-id="${ x.id }"><div class="m"><b>${ esc(x.payer) }</b><small>${ hm(x.created_at) } · ${ esc(x.branch) } · ${ esc(chan(x)) } · ${ esc(x.cashier_name) }${ x.code ? ' · ' + esc(x.code) : '' }</small></div><div><span class="num">${ fmt(x.amount, x.currency) }</span><span class="st ${ x.status }">${ lbl(x.status) }</span></div></div>`;
    }
    function renderSub() {
      const s = D.sub, c = s.currency, msgs = {
          unpaid: "Your shop isn't active yet. Pay the first month to unlock the dashboard and let cashiers in.",
          expired: 'Your subscription has expired. Renew to unlock your shop and cashiers.',
          suspended: 'Your shop was suspended by the platform admin. Contact support.',
          expiring: `Your subscription ends in ${ s.days_left } day(s). Renew now to avoid interruption.`,
          active: `Active until ${ dstr(s.expires_at) } (${ s.days_left } days left).`
        };
      const pend = D.payments.some(p => p.status === 'pending');
      $('#sub').innerHTML = `<h2>Subscription · ${ fmt(s.fee, c) } per month <span class="st ${ s.state }">${ s.state }</span></h2><p class="hint">${ msgs[s.state] }</p>${ pend ? '<div class="banner" style="margin-top:10px">A payment is waiting for admin confirmation.</div>' : '' }` + (s.state === 'suspended' ? '' : `<div id="payBox" style="margin-top:10px"><p style="font-size:14px">1. Send <b>${ fmt(s.fee, c) }</b> (or ${ fmt(s.fee * 2, c) } for 2 months…) by mobile money to <b>${ esc(s.pay_number) }</b> (${ esc(s.pay_name) }).<br>2. Paste the confirmation SMS below, then submit.</p>
        <label>Payment confirmation SMS</label><textarea class="in" id="pSms" placeholder="Paste the SMS you received after paying"></textarea>
        <label>Transaction code (if not in the SMS)</label><input class="in" id="pRef"><button class="btn p block" id="pGo" style="margin-top:10px">Submit payment</button></div>`) + (D.payments.length ? `<div class="tw" style="margin-top:12px"><table><tr><th>Date</th><th>Amount</th><th>Code</th><th>Status</th></tr>${ D.payments.map(p => `<tr><td>${ dstr(p.created_at) }</td><td>${ fmt(p.amount, c) }</td><td>${ esc(p.reference) }</td><td><span class="st ${ p.status }">${ p.status }</span></td></tr>`).join('') }</table></div>` : '');
    }
    $('#sub').addEventListener('click', async e => {
      if (e.target.id !== 'pGo')
        return;
      e.target.disabled = true;
      try {
        const r = await api('/api/owner/subscribe', {
          sms: $('#pSms').value,
          reference: $('#pRef').value,
          method: ''
        });
        toast(r.message);
        await load();
      } catch (x) {
        toast(x.message);
      }
      e.target.disabled = false;
    });
    function render() {
      $('#who').textContent = D.user.name + ' · ' + D.shop.name;
      const keep = document.activeElement && document.activeElement.closest('#sub');
      if (!keep || !$('#pSms') || !$('#pSms').value && !$('#pRef').value)
        renderSub();
      $('#body').hidden = D.locked;
      if (D.locked)
        return;
      const S = D.shop, c = S.currency, td = D.tx, ver = td.filter(x => x.status === 'verified'), tot = ver.reduce((s, x) => s + x.amount, 0);
      $('#code').textContent = S.code;
      $('#csv').href = '/api/owner/export?day=' + od;
      $('#k').innerHTML = [
        [
          'Total sales',
          fmt(tot, c)
        ],
        [
          'Transactions',
          ver.length
        ],
        [
          'Average sale',
          fmt(ver.length ? tot / ver.length : 0, c)
        ],
        [
          'Failed',
          td.filter(x => x.status === 'failed' || x.status === 'void').length
        ],
        [
          'Needs review',
          td.filter(x => x.status === 'review').length
        ]
      ].map(([a, b]) => `<div class="kpi"><small>${ a }</small><span class="num">${ b }</span></div>`).join('');
      $('#tgt').hidden = !S.target;
      if (S.target) {
        const p = Math.min(100, tot / S.target * 100);
        $('#tgt').innerHTML = `<h2>Daily target</h2><div style="background:var(--chip);border-radius:99px;height:16px;overflow:hidden"><div style="width:${ p }%;height:100%;background:var(--ok)"></div></div><p class="hint" style="margin-top:6px">${ fmt(tot, c) } of ${ fmt(S.target, c) } (${ Math.round(p) }%)</p>`;
      }
      $('#feed').innerHTML = td.slice(0, 60).map(row).join('') || '<p class="empty">No payments on this day.</p>';
      const hrs = Array(24).fill(0);
      ver.forEach(x => hrs[new Date(x.created_at).getHours()] += x.amount);
      const mx = Math.max(1, ...hrs);
      $('#hours').innerHTML = hrs.map((v, i) => `<i title="${ i }:00 – ${ fmt(v, c) }" style="height:${ v / mx * 100 }%"></i>`).join('');
      const days = [...Array(7)].map((_, i) => {
          const d = new Date();
          d.setDate(d.getDate() - 6 + i);
          return d;
        }), key = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      const wv = days.map(d => (D.week.find(w => w.day === key(d)) || { total: 0 }).total), wm = Math.max(1, ...wv);
      $('#wk').innerHTML = wv.map((v, i) => `<i title="${ fmt(v, c) }" style="height:${ v / wm * 100 }%"></i>`).join('');
      $('#wkl').innerHTML = days.map(d => `<span>${ d.toLocaleDateString([], { weekday: 'short' }) }</span>`).join('');
      const grp = f => {
          const m = {};
          ver.forEach(x => m[f(x)] = (m[f(x)] || 0) + x.amount);
          return Object.entries(m).sort((a, b) => b[1] - a[1]);
        }, bars = a => {
          const m = Math.max(1, ...a.map(z => z[1]));
          return a.map(([k, v]) => `<div class="brow"><span>${ esc(k) }</span><i style="width:${ v / m * 50 }%"></i><b class="num">${ fmt(v) }</b></div>`).join('') || '<p class="empty">No data yet.</p>';
        };
      $('#bb').innerHTML = bars(S.branches.map(b => [
        b,
        ver.filter(x => x.branch === b).reduce((s, x) => s + x.amount, 0)
      ]));
      $('#bm').innerHTML = bars(grp(chan));
      const byId = {};
      td.forEach(x => byId[x.id] = x);
      $('#fraud').innerHTML = D.patterns.map(p => `<div class="fa"><b>Pattern</b>${ esc(p) }</div>`).join('') + D.alerts.map(a => {
        const x = byId[a.id];
        if (!x)
          return '';
        const hard = a.flags.includes('duplicate') || a.flags.includes('mismatch');
        return `<div class="fa ${ hard ? '' : 'w' }"><b>${ fmt(x.amount, x.currency) } · ${ esc(x.payer) }</b>${ esc(a.flags.map(f => FL[f] || f).join(' · ')) }<br><small>${ hm(x.created_at) } · ${ esc(x.cashier_name) }</small><div class="acts">${ x.status === 'review' ? `<button class="btn p sm" data-i="${ x.id }" data-a="ok">Approve</button><button class="btn d sm" data-i="${ x.id }" data-a="no">Reject</button>` : '' }<button class="btn sm" data-i="${ x.id }" data-a="dismiss">Dismiss</button></div></div>`;
      }).join('') || '<p class="empty">Nothing suspicious. 👍</p>';
      $('#cash').innerHTML = D.cashiers.map(u => `<div class="row" style="cursor:default"><div class="m"><b>${ esc(u.name) }</b><small>${ esc(u.email) } ${ esc(u.phone) }</small></div><span class="st ${ u.status }">${ u.status }</span>
        <div style="display:flex;gap:4px">${ u.status === 'pending' ? `<button class="btn p sm" data-c="${ u.id }" data-a="approve">Allow</button><button class="btn d sm" data-c="${ u.id }" data-a="reject">Decline</button>` : u.status === 'approved' ? `<button class="btn d sm" data-c="${ u.id }" data-a="revoke">Remove</button>` : `<button class="btn sm" data-c="${ u.id }" data-a="approve">Allow</button>` }</div></div>`).join('') || '<p class="empty">No cashiers yet. Give them your shop code.</p>';
      if (!formInit) {
        formInit = true;
        $('#sName').value = S.name;
        $('#sCur').value = S.currency;
        $('#sBr').value = S.branches.join(', ');
        $('#sBig').value = S.big_amount;
        $('#sSt').value = S.stale_minutes;
        $('#sTg').value = S.target || '';
        $('#sCh').innerHTML = D.all_channels.map(ch => `<label class="chk"><input type="checkbox" value="${ esc(ch) }" ${ S.channels.includes(ch) ? 'checked' : '' }> ${ esc(ch) }</label>`).join('');
      }
    }
    document.addEventListener('click', async e => {
      const b = e.target.closest('[data-a]');
      if (!b)
        return;
      const a = b.dataset.a;
      try {
        if (b.dataset.c) {
          await api(`/api/owner/cashiers/${ b.dataset.c }/${ a }`, {});
          toast(a === 'approve' ? 'Cashier allowed in' : a === 'revoke' ? 'Access removed' : 'Declined');
        } else {
          await api(`/api/owner/tx/${ b.dataset.i }/${ a }`, {});
          toast('Updated');
        }
        await load();
      } catch (x) {
        toast(x.message);
      }
    });
    $('#feed').onclick = e => {
      const r = e.target.closest('.row');
      if (!r)
        return;
      const x = D.tx.find(t => t.id === r.dataset.id);
      if (!x)
        return;
      $('#sbody').innerHTML = `<h2>${ fmt(x.amount, x.currency) } <span class="st ${ x.status }">${ lbl(x.status) }</span></h2><p>${ esc(x.payer) }${ x.phone ? ' · ' + esc(x.phone) : '' }</p><p class="hint">${ esc(chan(x)) } · ${ dtm(x.created_at) } · ${ esc(x.branch) } · ${ esc(x.cashier_name) }</p>${ x.code ? `<p>Ref: <b>${ esc(x.code) }</b></p>` : '' }${ x.note ? `<p class="hint">${ esc(x.note) }</p>` : '' }${ x.sms ? `<p class="hint" style="margin-top:8px">SMS: ${ esc(x.sms) }</p>` : '' }${ x.status !== 'void' ? `<button class="btn d block" id="vd" style="margin-top:12px">Void this sale</button>` : '' }`;
      $('#sheet').classList.add('show');
      const v = $('#vd');
      if (v)
        v.onclick = async () => {
          const r = prompt('Why is this sale being voided?');
          if (!r)
            return;
          try {
            await api(`/api/owner/tx/${ x.id }/void`, { reason: r });
            $('#sheet').classList.remove('show');
            await load();
          } catch (e) {
            toast(e.message);
          }
        };
    };
    $('#sheet').onclick = e => {
      if (e.target.id === 'sheet')
        $('#sheet').classList.remove('show');
    };
    $('#sSave').onclick = async () => {
      try {
        await api('/api/owner/settings', {
          name: $('#sName').value,
          currency: $('#sCur').value,
          branches: $('#sBr').value.split(',').map(s => s.trim()),
          big_amount: $('#sBig').value,
          stale_minutes: $('#sSt').value,
          target: $('#sTg').value,
          channels: $$('#sCh input:checked').map(i => i.value)
        });
        toast('Settings saved');
        await load();
      } catch (e) {
        toast(e.message);
      }
    };
    $('#day').value = od;
    $('#day').onchange = e => {
      od = e.target.value || todayStr();
      load();
    };
    async function load() {
      D = await api('/api/owner/overview?day=' + od);
      render();
    }
    live(load);
  </script>
</body>
</html>
